[package]
name = "jim"
entry = "src/main.coil"
source-roots = ["src", "tests"]

[link]
frameworks = ["AppKit", "QuartzCore", "CoreGraphics", "CoreFoundation", "Metal", "CoreText", "Carbon", "IOKit", "IOSurface", "Security", "UniformTypeIdentifiers"]
libs = ["objc", "c++"]
flags = ["build/callbacks.o", "build/session-transport.o", "build/ghostty/lib/libghostty-internal.a"]

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
