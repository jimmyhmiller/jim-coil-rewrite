[package]
name = "jim"
entry = "src/main.coil"
source-roots = ["src", "tests"]
exclude = ["src/session/server.coil"]

[dependencies]
paper = { path = "../paper-test/lib/paper" }
layout = { path = "../paper-test/lib/layout" }

[link]
frameworks = ["AppKit", "QuartzCore", "CoreGraphics", "CoreFoundation", "Metal", "CoreText", "Carbon", "IOKit", "IOSurface", "Security", "UniformTypeIdentifiers", "ImageIO", "AVFoundation"]
libs = ["objc", "c++"]
flags = ["build/ghostty/lib/libghostty-internal.a"]

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
