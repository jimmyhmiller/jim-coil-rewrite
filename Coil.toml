[package]
name = "jim"
entry = "src/main.coil"
source-roots = ["src", "tests"]
exclude = ["src/session/server.coil", "src/jimc/main.coil"]

# Widgets compile through tpde alone, so Jim links no LLVM. Jim itself is still
# compiled with LLVM.
[build]
jit = "tpde"

[link]
frameworks = ["AppKit", "QuartzCore", "CoreGraphics", "CoreFoundation", "Metal", "CoreText", "Carbon", "IOKit", "AudioToolbox", "AVFoundation", "IOSurface", "Security", "UniformTypeIdentifiers", "CoreServices", "Quartz"]
libs = ["objc", "c++"]

[native-dependencies]
ghostty = { flags-command = "scripts/ghostty/link-flags.py internal" }
ghostty-vt = { flags-command = "scripts/ghostty/link-flags.py vt" }

# Jim's private terminal session service, launched by src/sessions.coil.
[artifacts.session]
kind = "executable"
entry = "src/session/server.coil"
out = "build/jim-session"
optimization = 2
native-dependencies = ["ghostty-vt"]

# The command line for controlling a running Jim. Needs no frameworks: it is only a
# socket client.
[artifacts.jimc]
kind = "executable"
entry = "src/jimc/main.coil"
out = "build/jimc"
optimization = 2

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
