[package]
name = "jim"
entry = "src/main.coil"
source-roots = ["src", "tests"]
exclude = ["src/session/server.coil"]

[link]
frameworks = ["AppKit", "QuartzCore", "CoreGraphics", "CoreFoundation", "Metal", "CoreText", "Carbon", "IOKit", "IOSurface", "Security", "UniformTypeIdentifiers", "CoreServices"]
libs = ["objc", "c++"]

[native-dependencies]
ghostty = { flags-command = "scripts/ghostty/link-flags.py internal" }
ghostty-vt = { flags-command = "scripts/ghostty/link-flags.py vt" }

# Jim's private terminal session service, launched by src/sessions.coil.
[artifacts.session]
kind = "executable"
entry = "src/session/server.coil"
out = "build/jim-session"
optimization = 2
native-dependencies = ["ghostty-vt"]

[test]
roots = ["tests"]
suffixes = ["_test.coil"]
